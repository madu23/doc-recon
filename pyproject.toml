[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docrecon"
version = "0.1.0"
description = "Auditable OCR-based Proof-of-Delivery reconciliation pipeline"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.5",
  "opencv-python>=4.10.0",
  "pytesseract>=0.3.13",
  "rapidfuzz>=3.9.0",
  "numpy>=1.26.0",
  "Pillow>=10.4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
docrecon = "docrecon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["docrecon*"]
